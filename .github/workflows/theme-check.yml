# ============================================================
#  Theme Check
#
#  Lints every Liquid / JSON change on push and pull request to main.
#  Runs Shopify's OFFICIAL Theme Check action (Shopify/theme-check-action),
#  using the repo's own .theme-check.yml config, and FAILS the job on any
#  error-level offence (--fail-level error is also the Theme Check default,
#  but we set it explicitly so CI behaviour never drifts).
#
#  No secrets required — Theme Check is a static analysis pass.
# ============================================================
name: Theme Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: read  -> checkout
# pull-requests: write -> lets the action annotate the PR diff
permissions:
  contents: read
  pull-requests: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official Shopify Theme Check action, pinned to the current major (v2).
      # Reads .theme-check.yml from the repo root (theme_root = ".").
      # `flags: --fail-level error` makes the step exit non-zero on errors.
      - name: Run Theme Check
        uses: Shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          base: main
          flags: '--fail-level error'
