# ============================================================
#  Release Theme ZIP
#
#  On a version tag (v*) or a manual run, builds insolab-shopify-theme.zip
#  with the THEME FILES AT THE ZIP ROOT (no wrapping folder) using python3
#  zipfile, then attaches it to a GitHub Release.
#
#  Install the result via Shopify admin:
#    Online Store -> Themes -> Add theme -> Upload zip file -> pick the asset.
#
#  No secrets required — the default GITHUB_TOKEN is enough (contents: write).
# ============================================================
name: Release Theme ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the zip to (e.g. v1.0.0)'
        required: true
        type: string

# contents: write -> create the release and upload the asset
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & attach theme zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the zip with theme folders at the ZIP ROOT (arcname is relative to
      # the repo root). Only real theme folders are included — never .github,
      # node_modules, .git, shopify.theme.toml, or previously built zips.
      - name: Build theme zip (files at zip root)
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          THEME_DIRS = [
              "assets",
              "config",
              "layout",
              "locales",
              "sections",
              "snippets",
              "templates",
          ]
          OUT = "insolab-shopify-theme.zip"

          with zipfile.ZipFile(OUT, "w", zipfile.ZIP_DEFLATED) as z:
              for d in THEME_DIRS:
                  if not os.path.isdir(d):
                      print("skip (missing):", d)
                      continue
                  for root, _dirs, files in os.walk(d):
                      for name in sorted(files):
                          path = os.path.join(root, name)
                          # relpath from repo root => theme files at ZIP ROOT
                          z.write(path, os.path.relpath(path, "."))
          print("wrote", OUT)

          with zipfile.ZipFile(OUT) as z:
              names = z.namelist()
              print("entries:", len(names))
              for n in names[:5]:
                  print("  ", n)
          PY

      # softprops/action-gh-release has a floating v3 major tag (there is no
      # bare `v2` tag), so pin to v3.
      - name: Attach zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: insolab-shopify-theme.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
